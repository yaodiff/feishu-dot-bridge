<svg xmlns="http://www.w3.org/2000/svg" width="560" height="2070" viewBox="0 0 560 2070" role="img" aria-labelledby="title desc"><title id="title">在飞书里，看见 dot 的结果</title><desc id="desc">合成示例 · 非真实聊天截图</desc><rect width="100%" height="100%" fill="#f3f6ff"/><g font-family="Arial, Noto Sans CJK SC, PingFang SC, sans-serif"><text x="32" y="40" font-size="16" fill="#5c7caf" font-weight="bold">FEISHU ↔ DOT</text><text x="32" y="84" font-size="30" fill="#273952" font-weight="bold">在飞书里，看见 dot 的结果</text><text x="32" y="122" font-size="19" fill="#7a568f" font-weight="normal">合成示例 · 非真实聊天截图</text><text x="32" y="153" font-size="17" fill="#63738b" font-weight="normal">同一绑定私聊 · 由 dot 显式调用工具发送</text><rect x="32" y="184" width="496" height="440" rx="14" fill="white" stroke="#d9e2f5"/><text x="56" y="226" font-size="26" fill="#273952" font-weight="bold">01 文字回复</text><rect x="56" y="250" width="448" height="60" rx="14" fill="#eef2ff" stroke="none"/><text x="72" y="288" font-size="21" fill="#273952" font-weight="normal">请整理这次演示的要点。</text><rect x="56" y="334" width="448" height="174" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><text x="72" y="366" font-size="18" fill="#7b65ad" font-weight="bold">dot</text><text x="72" y="407" font-size="23" fill="#273952" font-weight="normal">演示要点已整理：</text><text x="72" y="441" font-size="23" fill="#273952" font-weight="normal">1. 说明目标与边界</text><text x="72" y="475" font-size="23" fill="#273952" font-weight="normal">2. 列出接下来的步骤</text><text x="56" y="572" font-size="20" fill="#5d789d" font-weight="normal">授权回复 → 原消息</text><rect x="32" y="644" width="496" height="440" rx="14" fill="white" stroke="#d9e2f5"/><text x="56" y="686" font-size="26" fill="#273952" font-weight="bold">02 当前生成图片</text><rect x="56" y="710" width="448" height="56" rx="14" fill="#eef2ff" stroke="none"/><text x="72" y="745" font-size="20" fill="#273952" font-weight="normal">请生成一张简洁的流程示意图。</text><rect x="56" y="786" width="448" height="176" rx="14" fill="#eaf1ff" stroke="none"/><circle cx="128.0" cy="857" r="29" fill="#b4ccfa"/><path d="M 162.0 857 h 84.0" stroke="#8295bc" stroke-width="3"/><path d="M 240.0 852 l 6 5 -6 5" fill="none" stroke="#8295bc" stroke-width="3"/><circle cx="280.0" cy="857" r="29" fill="#cfc0f5"/><path d="M 314.0 857 h 84.0" stroke="#8295bc" stroke-width="3"/><path d="M 392.0 852 l 6 5 -6 5" fill="none" stroke="#8295bc" stroke-width="3"/><circle cx="432.0" cy="857" r="29" fill="#b4e3d4"/><text x="72" y="930" font-size="19" fill="#607ca7" font-weight="normal">图片内容示意 · PNG/JPEG</text><text x="56" y="1009" font-size="19" fill="#5d789d" font-weight="normal">实际字节 → 图片上传 → 图片消息</text><text x="56" y="1040" font-size="19" fill="#5d789d" font-weight="normal">上传与消息回执分别记录</text><rect x="32" y="1104" width="496" height="440" rx="14" fill="white" stroke="#d9e2f5"/><text x="56" y="1146" font-size="26" fill="#273952" font-weight="bold">03 进度卡片更新</text><rect x="56" y="1170" width="448" height="104" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><rect x="56" y="1170" width="448" height="43" rx="8" fill="#2474ce" stroke="none"/><text x="72" y="1199" font-size="22" fill="white" font-weight="bold">dot · 处理中</text><text x="72" y="1249" font-size="22" fill="#273952" font-weight="normal">正在整理演示材料</text><rect x="56" y="1344" width="448" height="104" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><rect x="56" y="1344" width="448" height="43" rx="8" fill="#22874c" stroke="none"/><text x="72" y="1373" font-size="22" fill="white" font-weight="bold">dot · 完成</text><text x="72" y="1423" font-size="22" fill="#273952" font-weight="normal">材料已整理完成</text><text x="72" y="1316" font-size="21" fill="#7b65ad" font-weight="bold">↓ PATCH 同一卡片</text><text x="56" y="1498" font-size="19" fill="#5d789d" font-weight="normal">普通进度更新，不另发新卡片</text><rect x="32" y="1564" width="496" height="440" rx="14" fill="white" stroke="#d9e2f5"/><text x="56" y="1606" font-size="26" fill="#273952" font-weight="bold">04 等待确认入口</text><rect x="56" y="1630" width="448" height="252" rx="14" fill="#fffaf1" stroke="#f0dfc1"/><rect x="56" y="1630" width="448" height="48" rx="8" fill="#d88716" stroke="none"/><text x="72" y="1662" font-size="22" fill="white" font-weight="bold">dot · 等待确认</text><text x="72" y="1721" font-size="20" fill="#273952" font-weight="normal">需要执行：检查并确认示例发布</text><text x="72" y="1758" font-size="20" fill="#273952" font-weight="normal">原因：发布会影响外部服务</text><rect x="72" y="1787" width="416" height="59" rx="8" fill="#2474ce" stroke="none"/><text x="90" y="1825" font-size="22" fill="white" font-weight="bold">打开 dot ↗</text><text x="56" y="1927" font-size="19" fill="#5d789d" font-weight="normal">跳转到官方 dot 入口 → Activity</text><text x="56" y="1958" font-size="19" fill="#5d789d" font-weight="normal">点击不授予权限；在原请求中确认</text><text x="32" y="2040" font-size="17" fill="#65768c" font-weight="normal">示例不证明 API 接受、客户端显示或已读。</text><text x="32" y="2065" font-size="17" fill="#65768c" font-weight="normal">状态由调用者提交。</text></g></svg>