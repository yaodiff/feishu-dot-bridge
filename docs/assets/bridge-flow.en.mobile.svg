<svg xmlns="http://www.w3.org/2000/svg" width="640" height="960" viewBox="0 0 640 960" role="img" aria-labelledby="title description"><title id="title">Your chats. Your dot. Connected.</title><desc id="description">Feishu WebSocket enters the bridge; signed event callbacks notify dot. Dot calls MCP through its owner-only official Tunnel on the same host; the bridge sends authorized Feishu API replies.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3" markerHeight="3" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3769d9"/></marker><marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3" markerHeight="3" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7654cc"/></marker></defs><rect width="640" height="960" rx="28" fill="#f3f6fc"/><g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Noto Sans CJK SC, PingFang SC, sans-serif"><text x="32" y="56" font-size="22" fill="#53709f" font-weight="600" text-anchor="start">FEISHU ↔ DOT</text><text x="32" y="106" font-size="32" fill="#17294a" font-weight="700" text-anchor="start">Your chats. Your dot. Connected.</text><rect x="32" y="146" width="576" height="150" rx="22" fill="#fff" stroke="#dbe3f0" stroke-width="2" /><text x="60" y="191" font-size="32" fill="#263654" font-weight="650" text-anchor="start">Your Feishu DM</text><text x="60" y="232" font-size="27" fill="#5d6d87" font-weight="400" text-anchor="start">Your own bot</text><text x="60" y="270" font-size="23" fill="#315d9c" font-weight="400" text-anchor="start">PNG/JPEG · optional</text><rect x="32" y="390" width="576" height="228" rx="22" fill="#edf2fc" stroke="#bfcee7" stroke-width="2" stroke-dasharray="8 6" /><text x="60" y="435" font-size="30" fill="#263654" font-weight="650" text-anchor="start">Your own host</text><text x="60" y="479" font-size="29" fill="#263654" font-weight="600" text-anchor="start">bridge · SQLite</text><text x="60" y="527" font-size="27" fill="#63469b" font-weight="400" text-anchor="start">Official OpenAI Tunnel</text><text x="60" y="576" font-size="23" fill="#5d6d87" font-weight="400" text-anchor="start">loopback MCP · Owner-only access</text><rect x="32" y="710" width="576" height="158" rx="22" fill="#fff" stroke="#dbe3f0" stroke-width="2" /><text x="60" y="757" font-size="32" fill="#263654" font-weight="650" text-anchor="start">Your existing dot</text><text x="60" y="799" font-size="27" fill="#5d6d87" font-weight="400" text-anchor="start">Works on authorized tasks</text><text x="60" y="839" font-size="25" fill="#5d6d87" font-weight="400" text-anchor="start">Calls tools to send replies</text><path d="M 132 300 L 132 385" fill="none" stroke="#3769d9" stroke-width="4" stroke-linejoin="round" marker-end="url(#blue)"/><text x="160" y="352" font-size="26" fill="#3769d9" font-weight="550" text-anchor="start">WebSocket</text><path d="M 510 386 L 510 301" fill="none" stroke="#7654cc" stroke-width="4" stroke-linejoin="round" marker-end="url(#purple)"/><text x="486" y="377" font-size="25" fill="#7654cc" font-weight="550" text-anchor="end">Feishu API</text><path d="M 132 622 L 132 705" fill="none" stroke="#3769d9" stroke-width="4" stroke-linejoin="round" marker-end="url(#blue)"/><text x="160" y="674" font-size="25" fill="#3769d9" font-weight="550" text-anchor="start">Events / callback</text><path d="M 510 706 L 510 623" fill="none" stroke="#7654cc" stroke-width="4" stroke-linejoin="round" marker-end="url(#purple)"/><text x="486" y="704" font-size="25" fill="#7654cc" font-weight="550" text-anchor="end">MCP tools</text><text x="32" y="921" font-size="23" fill="#5d6d87" font-weight="400" text-anchor="start">Illustration · Not a screenshot</text></g></svg>
