<svg xmlns="http://www.w3.org/2000/svg" width="560" height="2120" viewBox="0 0 560 2120" role="img" aria-labelledby="title desc"><title id="title">See dot results in Feishu</title><desc id="desc">Synthetic examples · Not real chat screenshots</desc><rect width="100%" height="100%" fill="#f3f6ff"/><g font-family="Arial, Noto Sans CJK SC, PingFang SC, sans-serif"><text x="32" y="40" font-size="16" fill="#5c7caf" font-weight="bold">FEISHU ↔ DOT</text><text x="32" y="84" font-size="30" fill="#273952" font-weight="bold">See dot results in Feishu</text><text x="32" y="122" font-size="19" fill="#7a568f" font-weight="normal">Synthetic examples · Not real chat screenshots</text><text x="32" y="153" font-size="17" fill="#63738b" font-weight="normal">One paired DM · Dot explicitly calls the send tools</text><rect x="32" y="184" width="496" height="440" rx="14" fill="white" stroke="#d9e2f5"/><text x="56" y="226" font-size="26" fill="#273952" font-weight="bold">01 Text reply</text><rect x="56" y="250" width="448" height="60" rx="14" fill="#eef2ff" stroke="none"/><text x="72" y="288" font-size="21" fill="#273952" font-weight="normal">Summarize this demo, please.</text><rect x="56" y="334" width="448" height="174" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><text x="72" y="366" font-size="18" fill="#7b65ad" font-weight="bold">dot</text><text x="72" y="407" font-size="23" fill="#273952" font-weight="normal">Demo notes are ready:</text><text x="72" y="441" font-size="23" fill="#273952" font-weight="normal">1. Explain the goal and limits</text><text x="72" y="475" font-size="23" fill="#273952" font-weight="normal">2. List the next steps</text><text x="56" y="572" font-size="20" fill="#5d789d" font-weight="normal">Authorized reply → original message</text><rect x="32" y="644" width="496" height="440" rx="14" fill="white" stroke="#d9e2f5"/><text x="56" y="686" font-size="26" fill="#273952" font-weight="bold">02 Current generated image</text><rect x="56" y="710" width="448" height="56" rx="14" fill="#eef2ff" stroke="none"/><text x="72" y="745" font-size="20" fill="#273952" font-weight="normal">Create a simple flow illustration.</text><rect x="56" y="786" width="448" height="176" rx="14" fill="#eaf1ff" stroke="none"/><circle cx="128.0" cy="857" r="29" fill="#b4ccfa"/><path d="M 162.0 857 h 84.0" stroke="#8295bc" stroke-width="3"/><path d="M 240.0 852 l 6 5 -6 5" fill="none" stroke="#8295bc" stroke-width="3"/><circle cx="280.0" cy="857" r="29" fill="#cfc0f5"/><path d="M 314.0 857 h 84.0" stroke="#8295bc" stroke-width="3"/><path d="M 392.0 852 l 6 5 -6 5" fill="none" stroke="#8295bc" stroke-width="3"/><circle cx="432.0" cy="857" r="29" fill="#b4e3d4"/><text x="72" y="930" font-size="19" fill="#607ca7" font-weight="normal">Illustrated image · PNG/JPEG</text><text x="56" y="1009" font-size="19" fill="#5d789d" font-weight="normal">Actual bytes → upload → image message</text><text x="56" y="1040" font-size="19" fill="#5d789d" font-weight="normal">Upload and message receipts are separate</text><rect x="32" y="1104" width="496" height="440" rx="14" fill="white" stroke="#d9e2f5"/><text x="56" y="1146" font-size="26" fill="#273952" font-weight="bold">03 Progress card update</text><rect x="56" y="1170" width="448" height="104" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><rect x="56" y="1170" width="448" height="43" rx="8" fill="#2474ce" stroke="none"/><text x="72" y="1199" font-size="22" fill="white" font-weight="bold">dot · Processing</text><text x="72" y="1249" font-size="22" fill="#273952" font-weight="normal">Preparing demo material</text><rect x="56" y="1344" width="448" height="104" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><rect x="56" y="1344" width="448" height="43" rx="8" fill="#22874c" stroke="none"/><text x="72" y="1373" font-size="22" fill="white" font-weight="bold">dot · Completed</text><text x="72" y="1423" font-size="22" fill="#273952" font-weight="normal">The material is ready</text><text x="72" y="1316" font-size="21" fill="#7b65ad" font-weight="bold">↓ PATCH the same card</text><text x="56" y="1498" font-size="19" fill="#5d789d" font-weight="normal">Ordinary progress updates reuse one card</text><rect x="32" y="1564" width="496" height="440" rx="14" fill="white" stroke="#d9e2f5"/><text x="56" y="1606" font-size="26" fill="#273952" font-weight="bold">04 Confirmation entry</text><rect x="56" y="1630" width="448" height="252" rx="14" fill="#fffaf1" stroke="#f0dfc1"/><rect x="56" y="1630" width="448" height="48" rx="8" fill="#d88716" stroke="none"/><text x="72" y="1662" font-size="22" fill="white" font-weight="bold">dot · Waiting for confirmation</text><text x="72" y="1721" font-size="20" fill="#273952" font-weight="normal">Action: review the example release</text><text x="72" y="1758" font-size="20" fill="#273952" font-weight="normal">Reason: release affects external services</text><rect x="72" y="1787" width="416" height="59" rx="8" fill="#2474ce" stroke="none"/><text x="90" y="1825" font-size="22" fill="white" font-weight="bold">Open dot ↗</text><text x="56" y="1927" font-size="19" fill="#5d789d" font-weight="normal">Official dot entry → Activity</text><text x="56" y="1958" font-size="19" fill="#5d789d" font-weight="normal">Navigation only; approve in the original request</text><text x="32" y="2040" font-size="17" fill="#65768c" font-weight="normal">Examples do not prove API acceptance,</text><text x="32" y="2065" font-size="17" fill="#65768c" font-weight="normal">client display or read status.</text><text x="32" y="2090" font-size="17" fill="#65768c" font-weight="normal">Callers submit each state explicitly.</text></g></svg>