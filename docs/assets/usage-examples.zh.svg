<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1160" viewBox="0 0 1440 1160" role="img" aria-labelledby="title desc"><title id="title">在飞书里，看见 dot 的结果</title><desc id="desc">合成示例 · 非真实聊天截图</desc><rect width="100%" height="100%" fill="#f3f6ff"/><g font-family="Arial, Noto Sans CJK SC, PingFang SC, sans-serif"><text x="32" y="40" font-size="16" fill="#5c7caf" font-weight="bold">FEISHU ↔ DOT</text><text x="32" y="84" font-size="38" fill="#273952" font-weight="bold">在飞书里，看见 dot 的结果</text><text x="32" y="122" font-size="24" fill="#7a568f" font-weight="normal">合成示例 · 非真实聊天截图</text><text x="32" y="153" font-size="22" fill="#63738b" font-weight="normal">同一绑定私聊 · 由 dot 显式调用工具发送</text><rect x="40" y="194" width="664" height="440" rx="14" fill="white" stroke="#d9e2f5"/><text x="64" y="236" font-size="26" fill="#273952" font-weight="bold">01 文字回复</text><rect x="64" y="260" width="616" height="60" rx="14" fill="#eef2ff" stroke="none"/><text x="80" y="298" font-size="21" fill="#273952" font-weight="normal">请整理这次演示的要点。</text><rect x="64" y="344" width="616" height="174" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><text x="80" y="376" font-size="18" fill="#7b65ad" font-weight="bold">dot</text><text x="80" y="417" font-size="23" fill="#273952" font-weight="normal">演示要点已整理：</text><text x="80" y="451" font-size="23" fill="#273952" font-weight="normal">1. 说明目标与边界</text><text x="80" y="485" font-size="23" fill="#273952" font-weight="normal">2. 列出接下来的步骤</text><text x="64" y="582" font-size="20" fill="#5d789d" font-weight="normal">授权回复 → 原消息</text><rect x="736" y="194" width="664" height="440" rx="14" fill="white" stroke="#d9e2f5"/><text x="760" y="236" font-size="26" fill="#273952" font-weight="bold">02 当前生成图片</text><rect x="760" y="260" width="616" height="56" rx="14" fill="#eef2ff" stroke="none"/><text x="776" y="295" font-size="20" fill="#273952" font-weight="normal">请生成一张简洁的流程示意图。</text><rect x="760" y="336" width="616" height="176" rx="14" fill="#eaf1ff" stroke="none"/><circle cx="832.0" cy="407" r="29" fill="#b4ccfa"/><path d="M 866.0 407 h 168.0" stroke="#8295bc" stroke-width="3"/><path d="M 1028.0 402 l 6 5 -6 5" fill="none" stroke="#8295bc" stroke-width="3"/><circle cx="1068.0" cy="407" r="29" fill="#cfc0f5"/><path d="M 1102.0 407 h 168.0" stroke="#8295bc" stroke-width="3"/><path d="M 1264.0 402 l 6 5 -6 5" fill="none" stroke="#8295bc" stroke-width="3"/><circle cx="1304.0" cy="407" r="29" fill="#b4e3d4"/><text x="776" y="480" font-size="19" fill="#607ca7" font-weight="normal">图片内容示意 · PNG/JPEG</text><text x="760" y="559" font-size="19" fill="#5d789d" font-weight="normal">实际字节 → 图片上传 → 图片消息</text><text x="760" y="590" font-size="19" fill="#5d789d" font-weight="normal">上传与消息回执分别记录</text><rect x="40" y="658" width="664" height="440" rx="14" fill="white" stroke="#d9e2f5"/><text x="64" y="700" font-size="26" fill="#273952" font-weight="bold">03 进度卡片更新</text><rect x="64" y="724" width="616" height="104" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><rect x="64" y="724" width="616" height="43" rx="8" fill="#2474ce" stroke="none"/><text x="80" y="753" font-size="22" fill="white" font-weight="bold">dot · 处理中</text><text x="80" y="803" font-size="22" fill="#273952" font-weight="normal">正在整理演示材料</text><rect x="64" y="898" width="616" height="104" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><rect x="64" y="898" width="616" height="43" rx="8" fill="#22874c" stroke="none"/><text x="80" y="927" font-size="22" fill="white" font-weight="bold">dot · 完成</text><text x="80" y="977" font-size="22" fill="#273952" font-weight="normal">材料已整理完成</text><text x="80" y="870" font-size="21" fill="#7b65ad" font-weight="bold">↓ PATCH 同一卡片</text><text x="64" y="1052" font-size="19" fill="#5d789d" font-weight="normal">普通进度更新，不另发新卡片</text><rect x="736" y="658" width="664" height="440" rx="14" fill="white" stroke="#d9e2f5"/><text x="760" y="700" font-size="26" fill="#273952" font-weight="bold">04 等待确认入口</text><rect x="760" y="724" width="616" height="252" rx="14" fill="#fffaf1" stroke="#f0dfc1"/><rect x="760" y="724" width="616" height="48" rx="8" fill="#d88716" stroke="none"/><text x="776" y="756" font-size="22" fill="white" font-weight="bold">dot · 等待确认</text><text x="776" y="815" font-size="20" fill="#273952" font-weight="normal">需要执行：检查并确认示例发布</text><text x="776" y="852" font-size="20" fill="#273952" font-weight="normal">原因：发布会影响外部服务</text><rect x="776" y="881" width="584" height="59" rx="8" fill="#2474ce" stroke="none"/><text x="794" y="919" font-size="22" fill="white" font-weight="bold">打开 dot ↗</text><text x="760" y="1021" font-size="19" fill="#5d789d" font-weight="normal">跳转到官方 dot 入口 → Activity</text><text x="760" y="1052" font-size="19" fill="#5d789d" font-weight="normal">点击不授予权限；在原请求中确认</text><text x="40" y="1140" font-size="20" fill="#65768c" font-weight="normal">示例不证明 API 接受、客户端显示或已读；状态由调用者提交。</text></g></svg>