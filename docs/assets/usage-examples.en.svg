<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1160" viewBox="0 0 1440 1160" role="img" aria-labelledby="title desc"><title id="title">See dot results in Feishu</title><desc id="desc">Synthetic examples · Not real chat screenshots</desc><rect width="100%" height="100%" fill="#f3f6ff"/><g font-family="Arial, Noto Sans CJK SC, PingFang SC, sans-serif"><text x="32" y="40" font-size="16" fill="#5c7caf" font-weight="bold">FEISHU ↔ DOT</text><text x="32" y="84" font-size="38" fill="#273952" font-weight="bold">See dot results in Feishu</text><text x="32" y="122" font-size="24" fill="#7a568f" font-weight="normal">Synthetic examples · Not real chat screenshots</text><text x="32" y="153" font-size="22" fill="#63738b" font-weight="normal">One paired DM · Dot explicitly calls the send tools</text><rect x="40" y="194" width="664" height="440" rx="14" fill="white" stroke="#d9e2f5"/><text x="64" y="236" font-size="26" fill="#273952" font-weight="bold">01 Text reply</text><rect x="64" y="260" width="616" height="60" rx="14" fill="#eef2ff" stroke="none"/><text x="80" y="298" font-size="21" fill="#273952" font-weight="normal">Summarize this demo, please.</text><rect x="64" y="344" width="616" height="174" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><text x="80" y="376" font-size="18" fill="#7b65ad" font-weight="bold">dot</text><text x="80" y="417" font-size="23" fill="#273952" font-weight="normal">Demo notes are ready:</text><text x="80" y="451" font-size="23" fill="#273952" font-weight="normal">1. Explain the goal and limits</text><text x="80" y="485" font-size="23" fill="#273952" font-weight="normal">2. List the next steps</text><text x="64" y="582" font-size="20" fill="#5d789d" font-weight="normal">Authorized reply → original message</text><rect x="736" y="194" width="664" height="440" rx="14" fill="white" stroke="#d9e2f5"/><text x="760" y="236" font-size="26" fill="#273952" font-weight="bold">02 Current generated image</text><rect x="760" y="260" width="616" height="56" rx="14" fill="#eef2ff" stroke="none"/><text x="776" y="295" font-size="20" fill="#273952" font-weight="normal">Create a simple flow illustration.</text><rect x="760" y="336" width="616" height="176" rx="14" fill="#eaf1ff" stroke="none"/><circle cx="832.0" cy="407" r="29" fill="#b4ccfa"/><path d="M 866.0 407 h 168.0" stroke="#8295bc" stroke-width="3"/><path d="M 1028.0 402 l 6 5 -6 5" fill="none" stroke="#8295bc" stroke-width="3"/><circle cx="1068.0" cy="407" r="29" fill="#cfc0f5"/><path d="M 1102.0 407 h 168.0" stroke="#8295bc" stroke-width="3"/><path d="M 1264.0 402 l 6 5 -6 5" fill="none" stroke="#8295bc" stroke-width="3"/><circle cx="1304.0" cy="407" r="29" fill="#b4e3d4"/><text x="776" y="480" font-size="19" fill="#607ca7" font-weight="normal">Illustrated image · PNG/JPEG</text><text x="760" y="559" font-size="19" fill="#5d789d" font-weight="normal">Actual bytes → upload → image message</text><text x="760" y="590" font-size="19" fill="#5d789d" font-weight="normal">Upload and message receipts are separate</text><rect x="40" y="658" width="664" height="440" rx="14" fill="white" stroke="#d9e2f5"/><text x="64" y="700" font-size="26" fill="#273952" font-weight="bold">03 Progress card update</text><rect x="64" y="724" width="616" height="104" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><rect x="64" y="724" width="616" height="43" rx="8" fill="#2474ce" stroke="none"/><text x="80" y="753" font-size="22" fill="white" font-weight="bold">dot · Processing</text><text x="80" y="803" font-size="22" fill="#273952" font-weight="normal">Preparing demo material</text><rect x="64" y="898" width="616" height="104" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><rect x="64" y="898" width="616" height="43" rx="8" fill="#22874c" stroke="none"/><text x="80" y="927" font-size="22" fill="white" font-weight="bold">dot · Completed</text><text x="80" y="977" font-size="22" fill="#273952" font-weight="normal">The material is ready</text><text x="80" y="870" font-size="21" fill="#7b65ad" font-weight="bold">↓ PATCH the same card</text><text x="64" y="1052" font-size="19" fill="#5d789d" font-weight="normal">Ordinary progress updates reuse one card</text><rect x="736" y="658" width="664" height="440" rx="14" fill="white" stroke="#d9e2f5"/><text x="760" y="700" font-size="26" fill="#273952" font-weight="bold">04 Confirmation entry</text><rect x="760" y="724" width="616" height="252" rx="14" fill="#fffaf1" stroke="#f0dfc1"/><rect x="760" y="724" width="616" height="48" rx="8" fill="#d88716" stroke="none"/><text x="776" y="756" font-size="22" fill="white" font-weight="bold">dot · Waiting for confirmation</text><text x="776" y="815" font-size="20" fill="#273952" font-weight="normal">Action: review the example release</text><text x="776" y="852" font-size="20" fill="#273952" font-weight="normal">Reason: release affects external services</text><rect x="776" y="881" width="584" height="59" rx="8" fill="#2474ce" stroke="none"/><text x="794" y="919" font-size="22" fill="white" font-weight="bold">Open dot ↗</text><text x="760" y="1021" font-size="19" fill="#5d789d" font-weight="normal">Official dot entry → Activity</text><text x="760" y="1052" font-size="19" fill="#5d789d" font-weight="normal">Navigation only; approve in the original request</text><text x="40" y="1140" font-size="20" fill="#65768c" font-weight="normal">Examples do not prove API acceptance, client display or read status; callers submit states.</text></g></svg>