<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description"><title id="title">飞书里，接着聊</title><desc id="description">飞书消息经 WebSocket 进入 bridge，签名事件回调通知 dot。dot 通过同一主机上仅本人可用的官方 Tunnel 调用 MCP 工具；bridge 经飞书 API 发送已授权的回复。</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3" markerHeight="3" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3769d9"/></marker><marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3" markerHeight="3" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7654cc"/></marker></defs><rect width="1280" height="640" rx="28" fill="#f3f6fc"/><g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Noto Sans CJK SC, PingFang SC, sans-serif"><text x="48" y="58" font-size="20" fill="#53709f" font-weight="600" text-anchor="start">FEISHU ↔ DOT</text><text x="48" y="116" font-size="42" fill="#17294a" font-weight="700" text-anchor="start">飞书里，接着聊</text><text x="48" y="156" font-size="26" fill="#5d6d87" font-weight="400" text-anchor="start">一个人，一套自部署连接。</text><rect x="48" y="192" width="300" height="332" rx="22" fill="#fff" stroke="#dbe3f0" stroke-width="2" /><rect x="450" y="192" width="380" height="332" rx="22" fill="#edf2fc" stroke="#bfcee7" stroke-width="2" stroke-dasharray="8 6" /><rect x="932" y="192" width="300" height="332" rx="22" fill="#fff" stroke="#dbe3f0" stroke-width="2" /><text x="72" y="246" font-size="32" fill="#263654" font-weight="650" text-anchor="start">飞书私聊</text><text x="72" y="284" font-size="25" fill="#5d6d87" font-weight="400" text-anchor="start">你自己的机器人</text><rect x="72" y="444" width="252" height="48" rx="16" fill="#e9f1ff" stroke="#e9f1ff" stroke-width="2" /><text x="198" y="477" font-size="22" fill="#315d9c" font-weight="500" text-anchor="middle">PNG/JPEG · 可选</text><text x="474" y="246" font-size="28" fill="#263654" font-weight="650" text-anchor="start">你部署的主机</text><rect x="474" y="278" width="332" height="92" rx="22" fill="#fff" stroke="#dbe3f0" stroke-width="2" /><text x="640" y="315" font-size="28" fill="#263654" font-weight="650" text-anchor="middle">bridge</text><text x="640" y="348" font-size="21" fill="#5d6d87" font-weight="400" text-anchor="middle">收件与投递状态 · SQLite</text><rect x="474" y="430" width="332" height="62" rx="16" fill="#f1edfc" stroke="#d7cef0" stroke-width="2" /><text x="640" y="469" font-size="24" fill="#63469b" font-weight="550" text-anchor="middle">官方 OpenAI Tunnel</text><path d="M 640 428 L 640 374" fill="none" stroke="#7654cc" stroke-width="4" stroke-linejoin="round" marker-end="url(#purple)"/><text x="662" y="406" font-size="18" fill="#7654cc" font-weight="400" text-anchor="start">loopback</text><text x="956" y="246" font-size="30" fill="#263654" font-weight="650" text-anchor="start">已有的 dot</text><text x="956" y="284" font-size="22" fill="#5d6d87" font-weight="400" text-anchor="start">处理你授权的任务</text><text x="956" y="320" font-size="21" fill="#5d6d87" font-weight="400" text-anchor="start">调用工具，再送回回复</text><rect x="956" y="444" width="252" height="48" rx="16" fill="#f1edfc" stroke="#f1edfc" stroke-width="2" /><text x="1082" y="477" font-size="22" fill="#63469b" font-weight="500" text-anchor="middle">仅本人使用</text><path d="M 350 336 L 447 336" fill="none" stroke="#3769d9" stroke-width="4" stroke-linejoin="round" marker-end="url(#blue)"/><text x="399" y="318" font-size="18" fill="#3769d9" font-weight="550" text-anchor="middle">WebSocket</text><path d="M 832 348 L 929 348" fill="none" stroke="#3769d9" stroke-width="4" stroke-linejoin="round" marker-end="url(#blue)"/><text x="881" y="332" font-size="18" fill="#3769d9" font-weight="550" text-anchor="middle">事件通知</text><text x="881" y="377" font-size="17" fill="#5d6d87" font-weight="400" text-anchor="middle">callback</text><path d="M 448 392 L 351 392" fill="none" stroke="#7654cc" stroke-width="4" stroke-linejoin="round" marker-end="url(#purple)"/><text x="399" y="420" font-size="18" fill="#7654cc" font-weight="550" text-anchor="middle">飞书 API</text><path d="M 930 462 L 833 462" fill="none" stroke="#7654cc" stroke-width="4" stroke-linejoin="round" marker-end="url(#purple)"/><text x="881" y="443" font-size="18" fill="#7654cc" font-weight="550" text-anchor="middle">MCP tools</text><text x="48" y="587" font-size="23" fill="#5d6d87" font-weight="400" text-anchor="start">信息流示意 · 非产品截图 · 回复需由 dot 调用工具</text></g></svg>
